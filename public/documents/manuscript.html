<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CineAI Lab — Manuscript v0.10</title>
  <style>
    html,body{height:100%;margin:0;background:#0b0b0c;color:#f4f4f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:flex;flex-direction:column}
    header{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 16px;background:#111113;border-bottom:1px solid #2a2a2d}
    h1{font-size:15px;margin:0;font-weight:650}
    .meta{font-size:12px;color:#aaa}
    .actions{display:flex;gap:10px;align-items:center}
    a,button{color:#fff;background:#252529;border:1px solid #3a3a40;border-radius:8px;padding:8px 11px;text-decoration:none;font:inherit;cursor:pointer}
    a:hover,button:hover{background:#303036}
    #status{padding:18px;text-align:center;color:#c9c9cf}
    iframe{border:0;flex:1;width:100%;display:none;background:white}
    @media(max-width:700px){header{align-items:flex-start;flex-direction:column}.actions{width:100%;flex-wrap:wrap}}
  </style>
</head>
<body>
  <header>
    <div>
      <h1>CineAI Lab — Experimental Foundations for Open AI-Native Cinema</h1>
      <div class="meta">From Generated Clips to Image-Directed Filmmaking · v0.10 · 18 October 2026</div>
    </div>
    <div class="actions">
      <a href="/research/">Back to Research</a>\n      <a href="/" aria-label="Back to CineAI Lab">Home</a>
      <a id="download" href="#" download="CineAI_Lab_Experimental_Foundations_Open_AI_Native_Cinema.pdf" style="display:none">Download PDF</a>
    </div>
  </header>
  <div id="status">Loading the manuscript…</div>
  <iframe id="viewer" title="CineAI Lab manuscript PDF"></iframe>
  <script>
    const status = document.getElementById('status');
    const viewer = document.getElementById('viewer');
    const download = document.getElementById('download');
    const base = 'https://raw.githubusercontent.com/ReneBoroughs/cineai-lab/main/manuscript-source/v0.10/';
    const names = Array.from({length:16}, (_,i) => 'part-' + String(i+1).padStart(2,'0') + '.b64');

    async function load() {
      try {
        const chunks = await Promise.all(names.map(async name => {
          const response = await fetch(base + name, {cache:'no-store'});
          if (!response.ok) throw new Error(name + ': HTTP ' + response.status);
          return response.text();
        }));
        const encoded = chunks.join('').replace(/\s+/g,'');
        const binary = atob(encoded);
        const bytes = new Uint8Array(binary.length);
        for (let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const blob = new Blob([bytes], {type:'application/pdf'});
        const url = URL.createObjectURL(blob);
        viewer.src = url;
        viewer.style.display = 'block';
        download.href = url;
        download.style.display = 'inline-block';
        status.remove();
      } catch (error) {
        console.error(error);
        status.textContent = 'The manuscript could not be loaded. Please return to the site and try again.';
      }
    }
    load();
  </script>
</body>
</html>
